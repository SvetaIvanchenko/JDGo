<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset hasła — JDGo</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/pages/auth.html">JDGo</a></header>

  <main class="page">
    <div class="card">
      <h1>Nie pamiętasz hasła?</h1>
      <p class="lead">Podaj adres e-mail — wyślemy link do jednorazowego logowania.
        Po zalogowaniu zmienisz hasło w ustawieniach konta.</p>
      <form id="form">
        <label>Adres e-mail
          <input type="email" name="email" placeholder="email@example.com" required autofocus>
        </label>
        <button class="btn" type="submit">Wyślij link</button>
      </form>
      <p id="msg" class="msg"></p>
      <p class="row-links"><a href="/pages/login.html">Wróć do logowania</a></p>
    </div>
  </main>

  <footer class="footer"><a class="js-policy" href="#">Polityka prywatności</a></footer>

  <script src="/js/policy.js"></script>
  <script src="/js/auth-layout.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const msg = document.getElementById('msg');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      try {
        await api('/auth/password/forgot', 'POST', { email: e.target.email.value });
        msg.className = 'msg ok';
        msg.textContent = 'Jeśli konto istnieje, wysłaliśmy link do jednorazowego logowania. Sprawdź skrzynkę.';
      } catch (err) {
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
