<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weryfikacja logowania — JDGo</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/auth">JDGo</a></header>

  <main class="page">
    <div class="card">
      <h1>Weryfikacja logowania</h1>

      <!-- Wariant A: kod z aplikacji uwierzytelniającej (gdy 2FA włączone) -->
      <div id="totpBlock" style="display:none">
        <p class="lead">Wpisz 6-cyfrowy kod z aplikacji uwierzytelniającej.</p>
        <form id="totpForm">
          <label>Kod
            <input type="text" name="token" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                   placeholder="6 cyfr" autocomplete="one-time-code">
          </label>
          <button class="btn" type="submit">Potwierdź</button>
        </form>
        <p class="row-links">Nie masz dostępu do aplikacji?
          <a href="#" id="sendCode">Wyślij kod na e-mail</a></p>
      </div>

      <!-- Wariant B: jednorazowy kod wysłany na e-mail -->
      <div id="codeBlock" style="display:none">
        <p class="lead" id="codeLead">Wysłaliśmy 6-cyfrowy kod na Twój e-mail. Wpisz go poniżej.</p>
        <form id="codeForm">
          <label>Kod z e-maila
            <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                   placeholder="6 cyfr z e-maila" autocomplete="one-time-code">
          </label>
          <button class="btn" type="submit">Zaloguj się</button>
        </form>
        <p class="row-links"><a href="#" id="resendCode">Wyślij kod ponownie</a></p>
      </div>

      <p id="msg" class="msg"></p>
    </div>
  </main>

  <footer class="footer"><a class="js-policy" href="#">Polityka prywatności</a></footer>

  <script src="/js/policy.js"></script>
  <script src="/js/auth-layout.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const totpBlock = document.getElementById('totpBlock');
    const codeBlock = document.getElementById('codeBlock');
    const hasTotp = new URLSearchParams(location.search).get('totp') === '1';

    async function sendEmailCode() {
      msg.className = 'msg';
      try {
        await api('/auth/login/email-code', 'POST');
        totpBlock.style.display = 'none';
        codeBlock.style.display = 'block';
        document.querySelector('#codeForm input[name=code]').focus();
      } catch (err) { msg.textContent = err.message; }
    }

    // Wybór wariantu
    if (hasTotp) {
      totpBlock.style.display = 'block';
      document.querySelector('#totpForm input[name=token]').focus();
    } else {
      // brak authenticatora -> od razu wyślij kod na e-mail
      sendEmailCode();
    }

    // TOTP
    document.getElementById('totpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      try {
        await api('/auth/login/otp', 'POST', { token: e.target.token.value });
        location.href = '/';
      } catch (err) { msg.textContent = err.message; }
    });
    document.getElementById('sendCode').addEventListener('click', (e) => { e.preventDefault(); sendEmailCode(); });
    document.getElementById('resendCode').addEventListener('click', (e) => { e.preventDefault(); sendEmailCode(); });

    // Kod z e-maila
    document.getElementById('codeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      try {
        await api('/auth/login/email-verify', 'POST', { code: e.target.code.value });
        location.href = '/';
      } catch (err) { msg.textContent = err.message; }
    });
  </script>
</body>
</html>
